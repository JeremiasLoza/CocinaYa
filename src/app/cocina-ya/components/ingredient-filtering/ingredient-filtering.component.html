
<div class="selected-ingredients" *ngIf="selectedIngredients.length > 0">
  <h5>Ingredientes seleccionados</h5>

  <div class="selected-list">
    <span
      class="selected-chip"
      *ngFor="let ingredient of selectedIngredients">

      {{ ingredient.strIngredient }}

      <button
        type="button"
        class="remove-ingredient"
        [attr.aria-label]="'Quitar ' + ingredient.strIngredient"
        (click)="removeIngredient(ingredient)">
        &times;
      </button>
    </span>
  </div>
</div>

<div class="ingredient-search">
  <input
    type="text"
    class="form-control"
    placeholder="Buscar ingrediente..."
    [(ngModel)]="searchText">

  <p
    *ngIf="searchText.trim() && visibleIngredients.length === 0"
    class="text-center mt-3">
    No encontramos ingredientes con ese nombre.
  </p>
</div>

<div class="ingredients-grid">
  <label
    *ngFor="let ingredient of visibleIngredients"
    class="ingredient-option">

    <input
      type="checkbox"
      name="{{ingredient.strIngredient}}Checkbox"
      [(ngModel)]="ingredient.selected"
      (change)="onIngredientChange()">

    <span>{{ ingredient.strIngredient }}</span>
  </label>
</div>
