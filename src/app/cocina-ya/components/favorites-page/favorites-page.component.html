
<div *ngIf="errorLoading" class="alert alert-warning text-center mx-3">
  No pudimos cargar las recetas en este momento.
  Por favor, intentá nuevamente más tarde.
</div>

<div *ngIf="!errorLoading && haveFavorites">
  <app-list-recipes></app-list-recipes>
</div>

<div *ngIf="!errorLoading && !haveFavorites" class="container py-5">
  <div class="empty-favorites text-center mx-auto p-4 p-md-5">

    <div class="empty-favorites-icon mb-3">
      ♥
    </div>

    <h2 class="h4 mb-3">Todavía no tenés favoritos</h2>

    <p class="text-muted mb-4">
      Explorá nuestras recetas y guardá las que más te gusten
      para encontrarlas fácilmente cuando quieras volver a prepararlas.
    </p>

    <a routerLink="/home" class="btn btn-success">
      <i class="bi bi-search me-2"></i>
      Explorar recetas
    </a>

  </div>
</div>
